# Local development Docker Compose for RustyTalon
#
# Builds the image from source instead of pulling from ghcr.io, so you can
# test Rust and WASM changes without waiting for CI.
#
# Supports both database backends — set DATABASE_BACKEND in your .env:
#   DATABASE_BACKEND=libsql   (default, no postgres needed)
#   DATABASE_BACKEND=postgres (requires POSTGRES_PASSWORD in .env)
#
# First-time setup:
#   cp .env.example .env   # fill in API keys
#
# Full build + start (Rust binary + all WASM channels):
#   docker compose -f docker-compose.dev.yml up --build
#
# Rust binary change (recompiles everything):
#   docker compose -f docker-compose.dev.yml up --build
#
# WASM-only channel change (no full rebuild needed):
#   ./dev/build-channels.sh discord
#   docker compose -f docker-compose.dev.yml restart rustytalon
#
# Start with postgres backend:
#   docker compose -f docker-compose.dev.yml --profile postgres up --build
#
# Start with the knowledge graph (Neo4j, requires building with the `neo4j`
# Cargo feature -- see Dockerfile/README for enabling it):
#   docker compose -f docker-compose.dev.yml --profile neo4j up --build
#   Then set NEO4J_ENABLED=true and NEO4J_URI=bolt://neo4j:7687 in .env.
#
# Stop everything:
#   docker compose -f docker-compose.dev.yml down

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL with pgvector — only started when --profile postgres is used
  # ---------------------------------------------------------------------------
  postgres:
    profiles: ["postgres"]
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rustytalon}
      POSTGRES_USER: ${POSTGRES_USER:-rustytalon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rustytalon_dev}
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rustytalon}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Neo4j (knowledge graph) — only started when --profile neo4j is used
  # ---------------------------------------------------------------------------
  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474" # Neo4j Browser
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-devpassword}"
      # APOC is required by the merge_entities tool (apoc.refactor.mergeNodes).
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data-dev:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # RustyTalon agent — built from local source
  # ---------------------------------------------------------------------------
  rustytalon:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-3001}:3001"
    env_file: .env
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "3001"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      # Override baked-in WASM channels with locally built ones.
      # Run ./dev/build-channels.sh then restart to pick up changes.
      - ./dev/channels:/home/rustytalon/.rustytalon/channels
      # Uncomment to mount Docker socket for sandbox jobs:
      # - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata-dev:
  neo4j-data-dev:
